<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
</head>
<body>

  <div class="app-wrapper">

    <!-- ── 헤더 ── -->
    <header class="app-header">
      <h1 class="app-title">Todo</h1>
      <span class="todo-count" id="todoCount">0개 남음</span>
    </header>

    <!-- ── 일간 뷰 날짜 네비게이터 ── -->
    <section class="date-nav">
      <!-- 이전 날짜로 이동 -->
      <button class="btn-date-arrow" id="prevDateBtn" aria-label="이전 날짜">&#8592;</button>

      <div class="date-display">
        <!-- 오늘 날짜인지 강조 표시용 뱃지 -->
        <span class="today-badge hidden" id="todayBadge">오늘</span>
        <!-- 선택된 날짜 텍스트 (예: 2026년 6월 3일 화요일) -->
        <span class="date-label" id="dateLabel"></span>
      </div>

      <!-- 다음 날짜로 이동 -->
      <button class="btn-date-arrow" id="nextDateBtn" aria-label="다음 날짜">&#8594;</button>

      <!-- 오늘로 바로 돌아가는 버튼 (오늘이 아닐 때만 표시) -->
      <button class="btn-go-today hidden" id="goTodayBtn">오늘로</button>
    </section>

    <!-- ── 입력 영역 ── -->
    <section class="input-section">
      <div class="input-row">
        <input
          type="text"
          id="todoInput"
          class="todo-input"
          placeholder="새로운 할 일을 입력하세요..."
          maxlength="100"
          autocomplete="off"
        />
        <button id="addButton" class="btn btn-add" disabled>추가</button>
      </div>
    </section>

    <!-- ── 필터 탭 ── -->
    <nav class="filter-tabs" id="filterTabs">
      <button class="tab-btn active" data-filter="all">
        전체 <span class="tab-badge" id="badgeAll">0</span>
      </button>
      <button class="tab-btn" data-filter="active">
        진행 중 <span class="tab-badge" id="badgeActive">0</span>
      </button>
      <button class="tab-btn" data-filter="done">
        완료
      </button>
    </nav>

    <!-- ── Todo 목록 ── -->
    <main class="todo-list-wrapper">
      <div class="empty-state" id="emptyState">
        <p>이 날의 할 일이 없습니다 ✦</p>
      </div>
      <ul class="todo-list" id="todoList"></ul>
    </main>

    <!-- ── 일괄 액션 바 ── -->
    <div class="bulk-action-bar" id="bulkActionBar">
      <span class="bulk-count" id="bulkCount">0개 선택됨</span>
      <div class="bulk-buttons">
        <button class="btn btn-bulk-done"   id="bulkDoneBtn">완료 처리</button>
        <button class="btn btn-bulk-delete" id="bulkDeleteBtn">삭제</button>
      </div>
      <button class="btn-clear-select" id="clearSelectBtn" aria-label="선택 해제">✕</button>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
